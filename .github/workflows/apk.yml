name: APK

# Only trusted triggers: never pull_request, so the signing secrets cannot reach third-party branches.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Tests
        run: ./gradlew :core:test :app:testDebugUnitTest

      - name: Decode keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::Falta el secreto ANDROID_KEYSTORE_BASE64. Ejecuta scripts/firma/crear-firma (ver README)."
            exit 1
          fi
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/menucal.jks"

      - name: Build signed release APK
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/menucal.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
        run: ./gradlew :app:assembleRelease

      - name: Delete temporary keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/menucal.jks"

      - name: Rename APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/MenuCal.apk

      - uses: actions/upload-artifact@v4
        with:
          name: MenuCal
          path: dist/MenuCal.apk
          if-no-files-found: error
          retention-days: 7

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: MenuCal

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: v${{ github.run_number }}
        run: |
          gh release create "$TAG" MenuCal.apk \
            --target "$GITHUB_SHA" \
            --title "MenuCal $TAG" \
            --notes "Versión ${{ github.run_number }}. Instalación: ver INSTALAR_EN_MOVIL.md." \
            --latest
